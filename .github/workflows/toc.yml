name: Update README TOC

on:
  push:
    branches:
      - master
    paths:
      - "README.md"

permissions:
  contents: write

jobs:
  toc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update TOC
        uses: technote-space/toc-generator@v4
        with:
          TARGET_PATHS: README.md
          TOC_TITLE: "## Table of Contents"
          MAX_HEADER_LEVEL: 3
          COMMIT_MESSAGE: "docs: update README TOC"
